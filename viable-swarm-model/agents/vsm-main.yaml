version: 1
agent:
  extend: default
  name: vsm-main
  system_prompt_path: ./vsm-main.md
  system_prompt_args:
    VSM_SWARM_NAME: viable-swarm-model
    VSM_ROLE: S5 Policy / Orchestrator
  tools:
    - "kimi_cli.tools.agent:Agent"

# ── Agent Naming Convention ──
# Hyphen names  (vsm-coder, vsm-fixer, vsm-reporter, vsm-tester, vsm-researcher)
#   → Abstract PARENT agents. Extended by leaf agents via YAML `extend`.
#   → NOT registered in `subagents:` below. NOT spawned directly.
#   → Used for shared prompt fragments via Jinja `{% include %}`.
#
# Underscore names (vsm_backend_coder, vsm_security, vsm_meta, etc.)
#   → Concrete LEAF agents. Registered in `subagents:` below.
#   → Spawned directly by S5 during workflow execution.
#   → Extend a parent agent and add domain-specific behavior.
#
# External agents (vsm_trainer, vsm_experiment_designer)
#   → Live in companion skills (vsm-fitness-coach, vsm-fitness-gym).
#   → Registered here with relative paths to those skill directories.
    - "kimi_cli.tools.ask_user:AskUserQuestion"
    - "kimi_cli.tools.todo:SetTodoList"
    - "kimi_cli.tools.think:Think"
    - "kimi_cli.tools.shell:Shell"
    - "kimi_cli.tools.file:ReadFile"
    - "kimi_cli.tools.file:ReadMediaFile"
    - "kimi_cli.tools.file:Glob"
    - "kimi_cli.tools.file:Grep"
    - "kimi_cli.tools.file:WriteFile"
    - "kimi_cli.tools.file:StrReplaceFile"
    - "kimi_cli.tools.web:SearchWeb"
    - "kimi_cli.tools.web:FetchURL"
    - "kimi_cli.tools.plan.enter:EnterPlanMode"
    - "kimi_cli.tools.plan:ExitPlanMode"
    - "kimi_cli.tools.background:TaskList"
    - "kimi_cli.tools.background:TaskOutput"
    - "kimi_cli.tools.background:TaskStop"
  # ── AVAILABLE SUBAGENT TYPES ──
  # When --agent-file is loaded, BUILT-IN types (coder, explore, plan)
  # are UNAVAILABLE. Only the custom types listed below may be used.
  #
  # Available: vsm_architect, vsm_auditor, vsm_backend_coder, vsm_backend_fix_agent,
  #            vsm_backend_tester, vsm_coordinator, vsm_devops_coder, vsm_explore,
  #            vsm_frontend_coder, vsm_frontend_fix_agent, vsm_frontend_tester,
  #            vsm_meta, vsm_process_auditor, vsm_product, vsm_security,
  #            vsm_synthesizer, vsm_wiring
  # External:  vsm_experiment_designer (in vsm-fitness-gym),
  #            vsm_trainer (in vsm-fitness-coach)
  #
  # ERROR you will see if using wrong type: "subagent_type 'coder' is not registered"
  subagents:
    vsm_architect:
      path: ./vsm_architect.yaml
      description: S4 Intelligence
    vsm_auditor:
      path: ./vsm_auditor.yaml
      description: S3* Audit
    vsm_backend_coder:
      path: ./vsm_backend_coder.yaml
      description: S1 Backend Implementation
    vsm_backend_fix_agent:
      path: ./vsm_backend_fix_agent.yaml
      description: S1 Backend Fix
    vsm_backend_tester:
      path: ./vsm_backend_tester.yaml
      description: S1 Quality — Backend
    vsm_coordinator:
      path: ./vsm_coordinator.yaml
      description: S2 Coordination
    vsm_devops_coder:
      path: ./vsm_devops_coder.yaml
      description: S1 DevOps Implementation
    vsm_explore:
      path: ./vsm_explore.yaml
      description: S4 Exploration
    vsm_frontend_coder:
      path: ./vsm_frontend_coder.yaml
      description: S1 Frontend Implementation
    vsm_frontend_fix_agent:
      path: ./vsm_frontend_fix_agent.yaml
      description: S1 Frontend Fix
    vsm_frontend_tester:
      path: ./vsm_frontend_tester.yaml
      description: S1 Quality — Frontend
    vsm_meta:
      path: ./vsm_meta.yaml
      description: S5 Meta Evaluation
    vsm_process_auditor:
      path: ./vsm_process_auditor.yaml
      description: S5 Process Audit
    vsm_product:
      path: ./vsm_product.yaml
      description: S4 Intelligence (Product)
    vsm_security:
      path: ./vsm_security.yaml
      description: Security Audit
    vsm_wiring:
      path: ./vsm_wiring.yaml
      description: S2 Wiring
    vsm_synthesizer:
      path: ./vsm_synthesizer.yaml
      description: S2 Synthesis
    vsm_variety_engineer:
      path: ./vsm_variety_engineer.yaml
      description: S4* Variety Engineer — environmental scanning
    vsm_learning_curator:
      path: ./vsm_learning_curator.yaml
      description: S5* Learning Curator — mutation portfolio management
    vsm_trainer:
      path: ../../vsm-fitness-coach/agents/vsm_trainer.yaml
      description: S3* Evaluator — Fitness Trainer
    vsm_experiment_designer:
      path: ../../vsm-fitness-gym/agents/vsm_experiment_designer.yaml
      description: S4 Designer — Experiment Designer
